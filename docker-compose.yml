name: ${COMPOSE_PROJECT_NAME:-aequvg-backend}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aequvg}
      POSTGRES_USER: ${POSTGRES_USER:-aequvg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aequvg} -d ${POSTGRES_DB:-aequvg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://aequvg:change-me@db:5432/aequvg}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-with-a-long-random-value}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - backend_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backend_modules:
